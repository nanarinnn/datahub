<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>방명록 | YUYEON ONLY</title>
    <style>
        /* 폰트 적용 */
        @font-face {
            font-family: 'Paperlogy';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2');
            font-weight: 700;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
        }

        body { 
            background: #0e0e12; 
            color: #fff; 
            font-family: 'Paperlogy', sans-serif; 
            padding: 40px; 
            margin: 0;
        }
        
        .back-btn { 
            display: inline-block;
            margin-bottom: 10px;
        }
        
        .back-btn img { 
            height: 60px;
            width: auto;
            display: block;
        }
        
        h1 { 
            text-align: left; 
            margin-top: 0;
            margin-bottom: 8px; 
            font-size: 1.8rem; 
        }

        .page-desc {
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 30px;
            font-size: 0.95rem;
            font-weight: normal;
        }

        /* --- 방명록 컨테이너 --- */
        .guestbook-container {
            max-width: 1100px;
            width: 100%;
            background: #1c1c2e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 30px;
        }

        /* 모바일 최적화 */
        @media (max-width: 600px) {
            body { padding: 20px; }
            .guestbook-container { padding: 15px; }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">
        <img src="button/home_button.png" alt="홈으로">
    </a>
    
    <h1>방명록</h1>
    <div class="page-desc">자유롭게 한 줄 남겨주세요!</div>

    <div class="guestbook-container">
        <!-- Cusdis 방명록 위젯 영역 -->
        <div id="cusdis_thread"
          data-host="https://cusdis.com"
          data-app-id="e36e53ca-cb06-4384-9b75-34178d456523"
          data-page-id="yuyeon_guestbook"
          data-page-url="visit.html"
          data-page-title="방명록"
          data-theme="dark"
        ></div>
        <script async defer src="https://cusdis.com/js/cusdis.es.js"></script>
    </div>

</body>
</html>
