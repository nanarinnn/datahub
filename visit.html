<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>방명록 | YUYEON ONLY</title>
    <style>
        /* 폰트 적용 */
        @font-face {
            font-family: 'Paperlogy';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2');
            font-weight: 700;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
        }

        body { 
            background: #0e0e12; 
            color: #fff; 
            font-family: 'Paperlogy', sans-serif; 
            padding: 40px; 
            margin: 0;
        }
        
        .back-btn { 
            display: inline-block;
            margin-bottom: 10px;
        }
        
        .back-btn img { 
            height: 60px;
            width: auto;
            display: block;
        }
        
        h1 { 
            text-align: left; 
            margin-top: 0;
            margin-bottom: 8px; 
            font-size: 1.8rem; 
        }

        .page-desc {
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 30px;
            font-size: 0.95rem;
            font-weight: normal;
        }

        /* --- 방명록 컨테이너 --- */
        .guestbook-container {
            max-width: 1100px;
            width: 100%;
            background: #1c1c2e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 30px;
        }

        /* Disqus 영역 다크모드 대응 */
        #disqus_thread {
            color-scheme: dark;
        }

        /* 모바일 최적화 */
        @media (max-width: 600px) {
            body { padding: 20px; }
            .guestbook-container { padding: 15px; }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">
        <img src="button/home_button.png" alt="홈으로">
    </a>
    
    <h1>방명록</h1>
    <div class="page-desc">자유롭게 한 줄 남겨주세요!</div>

    <div class="guestbook-container">
        <!-- Disqus 방명록 위젯이 로드되는 영역 -->
        <div id="disqus_thread"></div>
    </div>

    <script>
        /**
        *  RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS.
        *  LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables
        */
        
        var disqus_config = function () {
            this.page.url = window.location.href;  // 현재 페이지 URL
            this.page.identifier = 'yuyeon_guestbook'; // 방명록 식별자 ID
        };

        (function() { // DON'T EDIT BELOW THIS LINE
            var d = document, s = d.createElement('script');
            
            // ★ 중요: 본인의 Disqus Shortname으로 아래 주소를 교체해주세요.
            s.src = 'https://YOUR_DISQUS_SHORTNAME.disqus.com/embed.js';
            
            s.setAttribute('data-timestamp', +new Date());
            (d.head || d.body).appendChild(s);
        })();
    </script>
    <noscript>방명록을 불러오려면 JavaScript를 활성화하세요. <a href="https://disqus.com/?ref_noscript">Disqus 댓글 플랫폼</a></noscript>

</body>
</html>
