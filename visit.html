<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>방명록 | YUYEON BIRTHDAY</title>
    <style>
        /* 폰트 적용 */
        @font-face {
            font-family: 'Paperlogy';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2');
            font-weight: 700;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background: #0e0e12; 
            color: #fff; 
            font-family: 'Paperlogy', sans-serif; 
            padding: 40px; 
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        
        /* --- 좌측 상단 홈 버튼 --- */
.back-btn {
    position: absolute;
    top: 30px; 
    left: 30px;
    z-index: 100;
    
    /* 텍스트 버튼 디자인 추가 */
    color: #fff;
    text-decoration: none; /* 밑줄 제거 */
    background: rgba(255, 255, 255, 0.1);
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: bold;
    border: 1px solid rgba(255, 255, 255, 0.2);
    transition: all 0.2s;
}

.back-btn:hover {
    background: #6c5ce7;
    border-color: #6c5ce7;
}
        
        /* --- 타이틀 --- */
        h1 { 
            margin-top: 10px;
            margin-bottom: 8px; 
            font-size: 2.2rem; 
            text-align: center;
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(108, 92, 231, 0.4); 
        }

        .page-desc {
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 30px;
            font-size: 1rem;
            text-align: center;
        }

        /* --- 방명록 컨테이너 --- */
        .guestbook-container {
            width: 100%;
            max-width: 800px;
            background: #1c1c2e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* --- 작성 폼 스타일 --- */
        .gb-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
            padding-bottom: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .gb-form-row {
            display: flex;
            gap: 10px;
        }

        .gb-input, .gb-textarea {
            background: #12121c;
            border: 1px solid #3d3d5c;
            border-radius: 6px;
            color: #fff;
            padding: 12px;
            font-family: inherit;
            font-size: 0.95rem;
        }

        .gb-input:focus, .gb-textarea:focus {
            outline: none;
            border-color: #6c5ce7;
        }

        .gb-input { flex: 1; }
        .gb-textarea { width: 100%; height: 90px; resize: vertical; }

        .gb-submit-btn {
            background: #6c5ce7;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .gb-submit-btn:hover { background: #5b4bc4; }

        /* --- 댓글 목록 스타일 --- */
        .gb-list { display: flex; flex-direction: column; gap: 15px; }
        
        .gb-card {
            background: #12121c;
            border: 1px solid #2a2a3d;
            border-radius: 8px;
            padding: 15px;
        }

        .gb-card-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        .gb-author { font-weight: bold; color: #a29bfe; }
        .gb-date { color: rgba(255, 255, 255, 0.4); }
        .gb-content { font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap; word-break: break-all; }

        /* --- 모바일 최적화 --- */
        @media (max-width: 600px) {
            body { padding: 80px 15px 20px 15px; }
            
            .back-btn { top: 15px; left: 15px; }
            .back-btn img { height: 45px; }
            
            h1 { font-size: 1.8rem; margin-top: 0; }
            .guestbook-container { padding: 20px; }
            .gb-form-row { flex-direction: column; }
        }
    </style>
</head>
<body>

<a href="index.html" class="back-btn">← HOME</a>
    
    <h1>방명록</h1>
    <div class="page-desc">자유롭게 축하 메시지를 남겨주세요!</div>

    <div class="guestbook-container">
        <!-- 방명록 입력 폼 -->
        <form id="guestbook-form" class="gb-form">
            <div class="gb-form-row">
                <input type="text" id="nickname" class="gb-input" placeholder="닉네임" required maxlength="20" />
            </div>
            <textarea id="content" class="gb-textarea" placeholder="남길 메시지를 적어주세요..." required></textarea>
            <button type="submit" class="gb-submit-btn">작성하기</button>
        </form>

        <!-- 방명록 목록 영역 -->
        <div id="guestbook-list" class="gb-list">
            <!-- JS로 불러온 방명록이 여기에 추가됩니다 -->
        </div>
    </div>

    <script>
        // 현재 외부용 스페셜 페이지의 방명록 ID
        const PAGE_ID = 'yuyeon_birthday_external'; 
        
        // ⭐️ 아래 두 줄에 발급받은 URL과 KEY를 붙여넣어 주세요!
        const SUPABASE_URL = 'https://tuqwintstnimajksseir.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_BDeUxFjo_f9VoNauPcov6Q_PISeqgip';

        // 1. 방명록 목록 불러오기
        async function fetchMessages() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/guestbook?page_id=eq.${PAGE_ID}&order=created_at.desc`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                const data = await res.json();
                
                const listContainer = document.getElementById('guestbook-list');
                listContainer.innerHTML = '';

                if (data.length === 0) {
                    listContainer.innerHTML = '<div style="text-align: center; color: rgba(255,255,255,0.4); padding: 20px;">아직 작성된 메시지가 없습니다. 첫 번째 방명록을 남겨주세요!</div>';
                    return;
                }

                data.forEach(msg => {
                    const card = document.createElement('div');
                    card.className = 'gb-card';
                    card.innerHTML = `
                        <div class="gb-card-header">
                            <span class="gb-author">${escapeHtml(msg.nickname)}</span>
                            <span class="gb-date">${new Date(msg.created_at).toLocaleString('ko-KR')}</span>
                        </div>
                        <div class="gb-content">${escapeHtml(msg.content)}</div>
                    `;
                    listContainer.appendChild(card);
                });
            } catch (err) {
                console.error('방명록을 불러오지 못했습니다:', err);
            }
        }

        // 2. 방명록 작성하기
        document.getElementById('guestbook-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nickname = document.getElementById('nickname').value;
            const content = document.getElementById('content').value;
            const submitBtn = document.querySelector('.gb-submit-btn');

            submitBtn.disabled = true;
            submitBtn.innerText = '작성 중...';

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/guestbook`, {
                    method: 'POST',
                    headers: { 
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({ page_id: PAGE_ID, nickname, content })
                });

                if (res.ok) {
                    document.getElementById('content').value = '';
                    fetchMessages(); 
                } else {
                    alert("작성에 실패했습니다. 데이터베이스 설정을 확인해주세요.");
                }
            } catch (err) {
                console.error('작성 실패:', err);
                alert("네트워크 오류가 발생했습니다.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = '작성하기';
            }
        });

        // XSS 방지 함수
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // 초기 목록 로드
        fetchMessages();
    </script>
</body>
</html>
