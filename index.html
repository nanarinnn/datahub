<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YUYEON ONLY</title>
    <style>
        body { 
            background: #0e0e12; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh;
        }
        
        .title-img { width: 400px; margin-bottom: 30px; } 
        
        .menu { display: flex; gap: 5px; align-items: center; }

        .menu a { display: flex; align-items: center; justify-content: center; }

        .menu a img { 
            height: 60px;
            width: auto;
            object-fit: contain;
            display: block;
            transition: transform 0.3s; 
        }
        
        .menu a:hover img { transform: scale(1.1); }
        
        /* 모바일용 설정 */
        @media (max-width: 600px) {
            .title-img { width: 85%; margin-bottom: 40px; }
            
            .menu { 
                flex-direction: row;     
                flex-wrap: wrap;         
                justify-content: center; 
                gap: 10px;               /* 버튼 간격을 15px로 늘려 시원하게 배치 */
                max-width: 320px;        
            }
            
            /* 버튼 크기를 55px로 키워 터치 편의성 향상 */
            .menu a img { height: 60px; } 
        }
    </style>
</head>
<body>

    <img src="indeximage/index.png" alt="YUYEON ONLY" class="title-img">
    
    <div class="menu">
        <a href="work.html"><img src="indeximage/button1.png" alt="캐릭터 추천"></a>
        <a href="flip.html"><img src="indeximage/button2.png" alt="카드 뒤집기"></a>
        <a href="todaymusic.html"><img src="indeximage/button3.png" alt="오늘의 추천곡"></a>
        <a href="miniroom.html"><img src="indeximage/button4.png" alt="미니룸"></a>
    </div>

</body>
</html>
