<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>캐릭터 추천 | YUYEON ONLY</title>
    <style>
        /* 폰트 적용 */
        @font-face {
            font-family: 'Paperlogy';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2');
            font-weight: 700;
            font-display: swap;
        }

        body { 
            background: #0e0e12; 
            color: #fff; 
            font-family: 'Paperlogy', sans-serif; /* 통일된 폰트 */
            padding: 40px; 
        }
        
.back-btn { 
    display: block; 
    margin-bottom: 20px; 
}

.back-btn img { 
    height: 30px; /* 원하는 높이로 조절하세요 */
    width: auto; 
    display: block;
}
        h1 { 
            text-align: left; 
            margin-bottom: 20px; 
            font-size: 1.8rem; 
        }
        .gallery { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 25px; 
            margin-top: 20px; 
            max-width: 1000px; 
        }

        .work-item { 
            display: flex; 
            flex-direction: column;
            width: 100%; 
            max-width: 300px; 
            border: 1px solid #333; 
            border-radius: 12px; 
            overflow: hidden; 
            cursor: pointer; 
            transition: 0.3s; 
            text-decoration: none; 
            color: white; 
            background: #1c1c2e;
        }
        
        .work-item:hover { 
            transform: translateY(-10px); 
            border-color: #6c3bff; 
        }
        
        .work-item img { 
            width: 100%; 
            height: auto;      
            display: block;    
        }
        
        .work-item h3 { 
            padding: 15px; 
            margin: 0; 
            font-size: 1rem; 
            text-align: center; 
        }
        .coming-soon { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: #1c1c2e; 
            border: 2px dashed #333; /* 점선 테두리로 느낌 다르게 */
            color: rgba(255, 255, 255, 0.3); 
            cursor: default; /* 클릭 안 되게 표시 */
        }
        
        .coming-soon:hover { 
            transform: none; /* hover 효과 제거 */
            border-color: #333; 
        }

        /* 모바일 최적화 */
        @media (max-width: 600px) {
            body { padding: 20px; }
            .work-item { max-width: 100%; } 
        }
    </style>
</head>
<body>
<a href="work.html" class="back-btn">
    <img src="button/home_button.png" alt="홈으로">
</a>
    <h1>캐릭터 추천</h1>
    
    <div class="gallery">
        <a href="gloomyday.html" class="work-item">
            <img src="workimage/work1.png" alt="작품1">
            <h3>뮤지컬 사의찬미 "사내"</h3>
        </a>

        <div class="work-item coming-soon">
            <h3>Coming Soon</h3>
        </div>
    </div>
</body>
</html>
