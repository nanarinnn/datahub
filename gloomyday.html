<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사의찬미 | YUYEON ONLY</title>
    <style>
        @font-face {
            font-family: 'Paperlogy';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2');
            font-weight: 700;
        }
        body { background: #0e0e12; color: #fff; font-family: 'Paperlogy', sans-serif; padding: 40px; }
        .back-btn { color: rgba(255,255,255,0.4); text-decoration: none; display: block; margin-bottom: 20px; }

        /* 좌우 2단 레이아웃 */
        .main-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; max-width: 1000px; margin: 0 auto; }
        
        .poster img { width: 100%; border-radius: 12px; display: block; }
        
        .info h1 { margin-top: 0; font-size: 1.5rem; }
        .characters { display: flex; gap: 15px; margin: 20px 0; }
        .char-card { 
    text-align: center; 
    background: #1c1c2e; 
    padding: 15px; 
    border-radius: 12px; 
    flex: 1; 
}
        .char-name {
    font-size: 1rem;       
    font-weight: bold;
    margin-top: 10px;
}
        .actor-name {
    font-size: 0.75rem;    
    color: rgba(255, 255, 255, 0.5); 
    display: block;        
    margin-top: 4px;
}
        .char-card img { 
            width: 100%;           /* 부모 박스(char-card) 너비에 맞춤 */
            aspect-ratio: 1 / 1;   /* 가로:세로 비율을 1:1 정사각형으로 강제 */
            object-fit: cover;     /* 이미지가 잘리지 않게 비율을 맞춰 채움 */
            border-radius: 8px;    /* 모서리를 둥글게 하면 더 예쁩니다 */
            display: block; 
            margin-bottom: 8px; 
        }
        .char-card:hover {background: #2a2a40; }
        .description { background: #1c1c2e; padding: 20px; border-radius: 12px; margin-top: 20px; line-height: 1.6; }

        /* 모바일 대응 (화면 좁아지면 1단으로) */
        @media (max-width: 768px) {
            body { padding: 20px; }
            .main-layout { grid-template-columns: 1fr; gap: 20px; }
        }
    </style>
</head>
<body>
    <a href="work.html" class="back-btn">← 뒤로가기</a>
    
    <div class="main-layout">
        <div class="poster">
            <img src="workimage/work1.png" alt="포스터">
        </div>

        <div class="info">
            <h1>우린 새로운 세상으로 갈거야, 준비됐어?</h1>
            <h3>캐릭터 목록</h3>
            
            <div class="characters">
<div class="characters">
    <div class="char-card">
        <img src="workimage/woojin.png" alt="김우진">
        <div class="char-name">김우진</div>
        <span class="actor-name">(배우: 주민진)</span>
    </div>

    <div class="char-card">
        <img src="workimage/simdeock.png" alt="윤심덕">
        <div class="char-name">윤심덕</div>
        <span class="actor-name">(배우: 안유진)</span>
    </div>

    <div class="char-card">
        <img src="workimage/sanae.png" alt="사내">
        <div class="char-name">사내</div>
        <span class="actor-name">(배우: 정민)</span>
    </div>
</div>
            </div>
            <div class="description">
                <h2>작품 소개</h2>
                <p>여기에 사의찬미 작품에 대한 설명을 자세히 적어주세요.</p>
        </div>
    </div>
</body>
</html>
