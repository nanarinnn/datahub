<!DOCTYPE html>

<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사의찬미 | YUYEON ONLY</title>
    <style>        
        @font-face {
            font-family: 'Paperlogy';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2');
            font-weight: 700;
        }
        body { background: #0e0e12; color: #fff; font-family: 'Paperlogy', sans-serif; padding: 40px; }
        .back-btn { color: rgba(255,255,255,0.4); text-decoration: none; display: block; margin-bottom: 20px; }

        /* 글자 끊김 방지 핵심 속성 (전체 적용) */
        h1, h3, .char-name, .actor-name { word-break: keep-all; }

        .main-layout { display: grid; grid-template-columns: 1fr 1.5fr; gap: 40px; max-width: 1100px; margin: 0 auto; }
        .poster img { width: 100%; border-radius: 12px; display: block; }
        .info h1 { margin: 0 0 20px 0; font-size: 1.6rem; }
        h3 { margin: 25px 0 10px 0; font-size: 1.2rem; }
        
        .characters { display: flex; gap: 15px; }
        .char-card { text-align: center; background: #1c1c2e; padding: 10px; border-radius: 12px; flex: 1; }
        .char-card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 8px; display: block; margin-bottom: 5px; }
        .char-name { font-size: 0.95rem; font-weight: bold; }
        .actor-name { font-size: 0.75rem; color: rgba(255,255,255,0.5); display: block; margin-top: 2px; white-space: nowrap; }
        
        .description { background: #1c1c2e; padding: 20px; border-radius: 12px; line-height: 1.6; }


        @media (max-width: 768px) {
            body { padding: 20px; }
            .main-layout { grid-template-columns: 1fr; gap: 20px; }
            .info h1 { font-size: 1.4rem; }
            .char-name { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <a href="work.html" class="back-btn">← 뒤로가기</a>
    
    <div class="main-layout">
        <div class="poster">
            <img src="workimage/work1.png" alt="포스터">
        </div>

        <div class="info">
            <h1>우린 새로운 세상으로 갈거야, 준비됐어?</h1>
            
            <h3>캐릭터 목록</h3>
            <div class="characters">
                <div class="char-card"><img src="workimage/woojin.png"><div class="char-name">김우진</div><span class="actor-name">(배우: 주민진)</span></div>
                <div class="char-card"><img src="workimage/simdeock.png"><div class="char-name">윤심덕</div><span class="actor-name">(배우: 안유진)</span></div>
                <div class="char-card"><img src="workimage/sanae.png"><div class="char-name">사내</div><span class="actor-name">(배우: 정민)</span></div>
            </div>
            
            <h3>작품/캐릭터 소개</h3>
            <div class="description">
                <p>여기에 작품과 캐릭터들에 대한 상세한 내용을 작성하세요.</p>
            </div>
        </div>
    </div>
</body>
</html>
