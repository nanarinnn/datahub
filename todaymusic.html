<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 추천곡 | YUYEON ONLY</title>
    <style>
        @font-face {
            font-family: 'Paperlogy-Bold';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Paperlogy-Medium';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2') format('woff2');
        }

        body { 
            background: #0e0e12; 
            color: #fff; 
            font-family: 'Paperlogy-Medium', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0;
            padding: 80px 20px 40px 20px;
        }

        .back-btn { position: absolute; top: 30px; left: 20px; }
        .back-btn img { height: 60px; width: auto; }

        .content-container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 1fr; /* 2개로 분할 */
            gap: 20px;
        }

        /* 공통 카드 스타일 */
        .card {
            background: #1c1c2e; 
            padding: 15px; 
            border-radius: 12px;
        }

        /* 영상 스타일 */
        .video-box iframe {
            width: 100%; aspect-ratio: 16 / 9; display: block; border: none;
        }
        .video-title {
            margin-top: 15px;
            font-family: 'Paperlogy-Bold', sans-serif;
            text-align: center;
        }

        /* Coming Soon 스타일 */
        .coming-box { 
            display: flex; align-items: center; justify-content: center; 
            border: 2px dashed #333; 
            color: rgba(255, 255, 255, 0.3); 
            min-height: 200px;
        }

        @media (max-width: 768px) {
            .content-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">
        <img src="button/home_button.png" alt="홈으로">
    </a>

    <div class="content-container">
        <div class="card">
            <div class="video-box">
                <iframe src="https://www.youtube.com/embed/CQFh1nwEsKs?si=Ht-dbH5NDdTOq6Dv" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>
            <div class="video-title">뮤지컬 '스토리 오브 마이 라이프', 나비</div>
        </div>

        <div class="card coming-box">
            <h3>Coming Soon</h3>
        </div>
    </div>

</body>
</html>
