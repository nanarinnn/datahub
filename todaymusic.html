<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 추천곡 | YUYEON ONLY</title>
    <style>
        @font-face {
            font-family: 'Paperlogy-Bold';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Paperlogy-Medium';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2') format('woff2');
        }

        body { 
            background: #0e0e12; 
            color: #fff; 
            font-family: 'Paperlogy-Medium', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0;
            padding: 40px;
        }

        /* 이미지 버튼 스타일 */
        .back-btn { 
            display: inline-block; 
            margin-bottom: 40px; /* 제목/박스와의 간격 */
        }
        .back-btn img { 
            height: 45px; 
            width: auto; 
            display: block; 
        }

        /* Coming Soon 박스 스타일 */
        .coming-box { 
            width: 100%;
            max-width: 400px;
            height: 200px;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: #1c1c2e; 
            border: 2px dashed #333; 
            color: rgba(255, 255, 255, 0.3); 
            border-radius: 12px;
            font-family: 'Paperlogy-Bold', sans-serif;
            font-size: 1.2rem;
        }

        /* 모바일 반응형 */
        @media (max-width: 600px) {
            body { padding: 20px; }
            .back-btn { margin-bottom: 30px; }
            .coming-box { height: 150px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">
        <img src="button/home_button.png" alt="홈으로">
    </a>

    <div class="coming-box">
        <h3>Coming Soon</h3>
    </div>

</body>
</html>
